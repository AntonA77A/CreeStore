name: Release

# Neuer Tag (z.B. v1.0.0) -> baut CreeStoreSetup.exe und CreeStore.apk und hängt sie ans GitHub-Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1 -Repo "${{ github.repository }}" -Version "${{ github.ref_name }}" -Branch "${{ github.event.repository.default_branch }}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CreeStoreSetup.exe
            dist/CreeStore.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Optionaler Signierschlüssel aus den Repo-Secrets (siehe README)
      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/creestore.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/creestore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64-Secret – die APK wird mit einem Debug-Schlüssel signiert, Updates klappen dann nicht."
          fi

      - name: Build
        working-directory: android
        env:
          CREESTORE_REPO: ${{ github.repository }}
          CREESTORE_BRANCH: ${{ github.event.repository.default_branch }}
          CREESTORE_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../CreeStore.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: CreeStore.apk
