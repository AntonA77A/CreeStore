name: Android

# Baut die APK bei jeder Änderung unter android/ – zum Testen als Download unter "Actions"
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        working-directory: android
        env:
          CREESTORE_REPO: ${{ github.repository }}
          CREESTORE_BRANCH: ${{ github.event.repository.default_branch }}
          CREESTORE_VERSION: 0.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CreeStore-apk
          path: android/app/build/outputs/apk/release/*.apk
